[project]
name = "fastapi-study"
version = "0.1.0"
description = ""
authors = [
    {name = "seoheejeong",email = "septemsun@naver.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "py-ulid (>=1.0.3,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "dependency-injector (>=4.49.1,<5.0.0)",
    "bcrypt (==4.0.1)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "email-validator (>=2.2.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx2 (>=2.12.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 한글 테스트 이름이 콘솔에서 깨지지 않도록
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    # 개발용 기본 시크릿이 32바이트 미만일 때 나오는 경고. 테스트에서는 무해하다
    "ignore:The HMAC key is:UserWarning",
]

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "scripts/*"]
